[project]
name = "tunnelscope"
version = "0.3.0"
description = "Evidence-tiered IPsec/IKE posture and PQ-migration assessment (SIH26160)"
requires-python = ">=3.11"
# fastapi/uvicorn removed (T-049, 2026-09-14): declared from the start but
# never used anywhere in tunnelscope/ - dead weight that also contradicted
# I9 (offline by default, no assumed network surface). A local-only API is
# planned (build/03-USAGE-AND-OPERATIONS-PLAN.md §3.4/§6) but needs its own
# security review before it ships; these deps come back only alongside it.
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tunnelscope = "tunnelscope.cli:main"

[tool.setuptools.packages.find]
include = ["tunnelscope*"]
