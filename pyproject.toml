[project]
name = "tunnelscope"
version = "0.1.0"
description = "Evidence-tiered IPsec/IKE posture and PQ-migration assessment (SIH26160)"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "PyYAML>=6.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
tunnelscope = "tunnelscope.cli:main"

[tool.setuptools.packages.find]
include = ["tunnelscope*"]
