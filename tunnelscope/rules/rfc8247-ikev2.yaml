baseline: RFC-8247
authority: "RFC 8247 - Algorithm Implementation Requirements and Usage Guidance for IKEv2 (updated by RFC 9395)"
url: "https://www.rfc-editor.org/rfc/rfc8247.html"
# T-122 part 4 / EXP-54 (pre-registered a28b90c). Every `quote` below is verbatim from the source file(s) named in `source`
# (keys, file names and SHA-256 in `sources`; the files are kept outside the repository), checked by
# experiments/exp54-rule-sources/analyze.py. `page` reads `source:N,N` using the [Page N] numbers of the plain-text RFC or draft;
# "n/a" means no source of the rule has page numbers. `note` records where the source and the rule differ; the rule is as it was.
sources:
  rfc8247: {file: rfc8247.txt, url: "https://www.rfc-editor.org/rfc/rfc8247.txt", sha256: e1e6a86cfddcb2ebbe39ba1c2cf5516b8cb5f39fd0d53dea468a522a3b7a7250}
rules:
  # RFC 8247 sec 2.4 (Type 4 table): 14 MUST, 19 SHOULD; 5 and 2 SHOULD NOT; 1 MUST NOT;
  # 22 MUST NOT ("too weak"); 23 and 24 SHOULD NOT ("expected to be further downgraded ... to
  # MUST NOT"). Groups the table does not list (15-18, 20, 21, 31, 32) are not discouraged.
  # Until 2026-09-18 this rule compared group NUMBERS (>= 14), which passed group 22 (EXP-13).
  - id: RFC8247-DH-MUST
    applies_to_ike_version: IKEv2
    title: "IKE SA key exchange must not use a group RFC 8247 marks MUST NOT or SHOULD NOT (1, 2, 5, 22, 23, 24)"
    attribute: ike_dh_group
    assert: {op: dh_group_not_in, value: [1, 2, 5, 22, 23, 24]}
    severity: high
    fail_message: "IKE SA uses a key-exchange group RFC 8247 marks MUST NOT (1, 22) or SHOULD NOT (2, 5, 23, 24)"
    section: "RFC 8247 2.4"
    page: "rfc8247:10,11"
    source: [rfc8247]
    quote:
      - "Group 5 or the 1536-bit MODP Group has been downgraded from MAY in RFC 4307 to SHOULD NOT."
      - "Group 2 or the 1024-bit MODP Group has been downgraded from MUST- in RFC 4307 to SHOULD NOT."
      - "It has, therefore, been downgraded to MUST NOT."
      - "This has resulted in group 22 to be demoted to MUST NOT."
      - "Groups 23 and 24 have been demoted to SHOULD NOT"
  - id: RFC8247-DH-OFFER
    applies_to_ike_version: IKEv2
    title: "An initiator's offer should not include groups RFC 8247 marks MUST NOT or SHOULD NOT"
    attribute: ike_offered_dh
    assert: {op: dh_groups_none_in, value: [1, 2, 5, 22, 23, 24]}
    severity: medium
    fail_message: "the initiator would accept a discouraged group if a responder chose it (downgrade exposure); only the initiator's offer is visible on the wire"
    section: "RFC 8247 2.4"
    page: "rfc8247:10,11"
    source: [rfc8247]
    quote:
      - "Group 5 or the 1536-bit MODP Group has been downgraded from MAY in RFC 4307 to SHOULD NOT."
      - "Group 2 or the 1024-bit MODP Group has been downgraded from MUST- in RFC 4307 to SHOULD NOT."
      - "This has resulted in group 22 to be demoted to MUST NOT."
    note: "RFC 8247 marks these groups SHOULD NOT / MUST NOT; it does not say that merely offering one is a downgrade exposure. That reasoning, and the medium severity, are this project's."
  - id: RFC8247-ENCR
    applies_to_ike_version: IKEv2
    title: "IKE encryption should be AES (GCM preferred; CBC acceptable)"
    attribute: ike_encr
    assert: {op: matches_any, value: ["AES-GCM", "AES-CBC", "ChaCha20"]}
    severity: medium
    fail_message: "IKE encryption is not an approved AES/ChaCha20 mode"
    section: "RFC 8247 2.1"
    page: "rfc8247:6"
    source: [rfc8247]
    quote:
      - "ENCR_AES_CBC | MUST | No"
      - "ENCR_AES_GCM_16 | SHOULD | Yes"
      - "ENCR_CHACHA20_POLY1305 | SHOULD | Yes"
      - "The reason for promotion from MAY to SHOULD is to promote the slightly more secure AEAD method over the traditional encrypt+auth method."
    note: "Stricter than the RFC in two places, both left as they were: the rule fails ENCR_3DES (the RFC says MAY) and AES-CCM-8 (the RFC says SHOULD, for IoT), because it accepts only names containing AES-GCM, AES-CBC or ChaCha20. The RFC makes AES-CBC the MUST algorithm, GCM and ChaCha20 SHOULD."
