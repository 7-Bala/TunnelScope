# EXP-11 (T-048) — certificate-based authentication arm, to validate the
# auth-method extractor (R7/OQ-05). Signed by our own test CA (certauth/pki/).
connections {
    certauth {
        local_addrs  = 10.10.1.10
        remote_addrs = 10.10.2.10
        local {
            auth = pubkey
            certs = aliceCert.pem
            id = "C=IN, O=TunnelScope, CN=alice-certauth"
        }
        remote {
            auth = pubkey
            id = "C=IN, O=TunnelScope, CN=bob-certauth"
        }
        version = 2
        proposals = aes256-sha256-modp2048
        children {
            certauth {
                local_ts = 10.10.1.10/32
                remote_ts = 10.10.2.10/32
                mode = tunnel
                esp_proposals = aes256gcm16
                start_action = none
                dpd_action = clear
                life_time = 3600
                rekey_time = 0
            }
        }
    }
}
