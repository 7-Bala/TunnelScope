# T-057 encapsulation lab: UDP-encapsulated ESP (RFC 3948, `encap = yes`) and
# native ESP over IPv6, so the ESP content-length offsets can be checked on
# real traffic. Same shape as docker-compose.yml (keyless router vantage between
# two strongSwan peers), separate names and subnets so both labs can coexist.
#
#   alice 10.20.1.10 / fd00:20:1::10 --- router --- bob 10.20.2.10 / fd00:20:2::10

services:
  router:
    build: { context: ./images/router }
    container_name: sih26e-router
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.conf.all.rp_filter: 0
    networks:
      enc-a: { ipv4_address: 10.20.1.1, ipv6_address: "fd00:20:1::1" }
      enc-b: { ipv4_address: 10.20.2.1, ipv6_address: "fd00:20:2::1" }
    volumes: [./captures:/captures]
    command: ["sleep", "infinity"]

  alice:
    build: { context: ./images/strongswan, dockerfile: Dockerfile.classical }
    container_name: sih26e-alice
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: { net.ipv6.conf.all.disable_ipv6: 0 }
    networks:
      enc-a: { ipv4_address: 10.20.1.10, ipv6_address: "fd00:20:1::10" }
    environment: { ROUTE_CIDR: 10.20.2.0/24, ROUTE_GW: 10.20.1.1 }
    volumes:
      - ./configs/encap/alice/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./configs/alice/strongswan.conf:/etc/strongswan.conf:ro
    depends_on: [router]
    command: ["charon"]

  bob:
    build: { context: ./images/strongswan, dockerfile: Dockerfile.classical }
    container_name: sih26e-bob
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls: { net.ipv6.conf.all.disable_ipv6: 0 }
    networks:
      enc-b: { ipv4_address: 10.20.2.10, ipv6_address: "fd00:20:2::10" }
    environment: { ROUTE_CIDR: 10.20.1.0/24, ROUTE_GW: 10.20.2.1 }
    volumes:
      - ./configs/encap/bob/swanctl.conf:/etc/swanctl/swanctl.conf:ro
      - ./configs/bob/strongswan.conf:/etc/strongswan.conf:ro
    depends_on: [router]
    command: ["charon"]

networks:
  # Explicit gateways keep Docker's bridge off .1 / ::1, where `router` lives.
  enc-a:
    enable_ipv6: true
    ipam: { config: [{ subnet: 10.20.1.0/24, gateway: 10.20.1.254 }, { subnet: "fd00:20:1::/64", gateway: "fd00:20:1::fe" }] }
  enc-b:
    enable_ipv6: true
    ipam: { config: [{ subnet: 10.20.2.0/24, gateway: 10.20.2.254 }, { subnet: "fd00:20:2::/64", gateway: "fd00:20:2::fe" }] }
