# T-057 encapsulation lab (testbed/docker-compose.encap.yml). Role: bob.
# Hand-written: 4 arms, UDP-encapsulated ESP (encap = yes) and native ESP over IPv6.

connections {
    encap-udp-aes256gcm16 {
        local_addrs  = 10.20.2.10
        remote_addrs = 10.20.1.10
        local { auth = psk
            id = bob-encap-udp-aes256gcm16 }
        remote { auth = psk
            id = alice-encap-udp-aes256gcm16 }
        version = 2
        proposals = aes256-sha256-modp2048
        encap = yes
        children {
            encap-udp-aes256gcm16 {
                local_ts = 10.20.2.10/32
                remote_ts = 10.20.1.10/32
                mode = tunnel
                esp_proposals = aes256gcm16
                start_action = none
                life_time = 3600
                rekey_time = 0
            }
        }
    }
    encap-udp-aes128cbc-sha256 {
        local_addrs  = 10.20.2.10
        remote_addrs = 10.20.1.10
        local { auth = psk
            id = bob-encap-udp-aes128cbc-sha256 }
        remote { auth = psk
            id = alice-encap-udp-aes128cbc-sha256 }
        version = 2
        proposals = aes256-sha256-modp2048
        encap = yes
        children {
            encap-udp-aes128cbc-sha256 {
                local_ts = 10.20.2.10/32
                remote_ts = 10.20.1.10/32
                mode = tunnel
                esp_proposals = aes128-sha256
                start_action = none
                life_time = 3600
                rekey_time = 0
            }
        }
    }
    ipv6-aes256gcm16 {
        local_addrs  = fd00:20:2::10
        remote_addrs = fd00:20:1::10
        local { auth = psk
            id = bob-ipv6-aes256gcm16 }
        remote { auth = psk
            id = alice-ipv6-aes256gcm16 }
        version = 2
        proposals = aes256-sha256-modp2048
        children {
            ipv6-aes256gcm16 {
                local_ts = fd00:20:2::10/128
                remote_ts = fd00:20:1::10/128
                mode = tunnel
                esp_proposals = aes256gcm16
                start_action = none
                life_time = 3600
                rekey_time = 0
            }
        }
    }
    ipv6-aes128cbc-sha256 {
        local_addrs  = fd00:20:2::10
        remote_addrs = fd00:20:1::10
        local { auth = psk
            id = bob-ipv6-aes128cbc-sha256 }
        remote { auth = psk
            id = alice-ipv6-aes128cbc-sha256 }
        version = 2
        proposals = aes256-sha256-modp2048
        children {
            ipv6-aes128cbc-sha256 {
                local_ts = fd00:20:2::10/128
                remote_ts = fd00:20:1::10/128
                mode = tunnel
                esp_proposals = aes128-sha256
                start_action = none
                life_time = 3600
                rekey_time = 0
            }
        }
    }
}

secrets {
    ike-1 {
        id-1 = %any
        id-2 = %any
        secret = "0sIhtestlab2026SIH26160presharedkeydonotusehere"
    }
}
