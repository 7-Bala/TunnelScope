# Explicit (non-modular) plugin load list for the source-built PQ image.
#
# WHY THIS EXISTS: the upstream `make install` from a plain source build
# installs EMPTY per-plugin stub files under strongswan.d/charon/*.conf
# (no `<name> { load = yes }` wrapper), unlike Debian's packaged build. With
# `load_modular = yes`, charon's plugin loader found no explicit `load = yes`
# key in any of those empty files and loaded NOTHING beyond the built-in
# `charon` plugin itself, so even NONCE_GEN/HASH_SHA1 were "unmet" despite
# the .so files being present and correctly linked. Root-caused via
# `--debug-lib 3`, which showed no "loading plugin '<name>'" lines at all
# before the failure. Documented in testbed/NOTES.md.
#
# Fix: list every plugin explicitly via `load`, in the same style the
# strongSwan documentation itself uses for non-modular configuration.
charon {
    load = random nonce openssl pem pkcs1 pkcs7 pkcs8 x509 revocation pubkey constraints eap-identity updown resolve attr socket-default kernel-netlink curl aes sha1 sha2 sha3 md5 gmp curve25519 hmac gcm ctr ccm chapoly drbg ml vici counters cmac kdf mgf1 dnskey pgp sshkey xcbc xauth-generic

    filelog {
        stderr {
            default = 2
            ike = 3
            enc = 2
            knl = 2
        }
    }
}
# Deliberately NOT including strongswan.d/*.conf: that could reintroduce
# `load_modular` from strongswan.d/charon.conf. An explicit `load = ...`
# list should take priority over load_modular per strongSwan's docs, but we
# avoid depending on that precedence and just keep this file self-contained.
