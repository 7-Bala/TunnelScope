# PQ arm config for EXP-04 (PQ key-exchange observability, PQ-6 length-asymmetry
# hypothesis). Two connections, otherwise identical, differing ONLY in whether
# an RFC 9370 additional key exchange (ML-KEM-768) is negotiated:
#
#   classical-baseline : proposals = aes256-sha256-modp2048               (classical DH only)
#   pq-mlkem768         : proposals = aes256-sha256-modp2048-ke1_mlkem768 (+ ML-KEM-768 ADDKE)
#
# Ground truth: this file (T2). The question under test is whether a T0/T1
# passive observer can tell these two apart from KE-payload LENGTH ALONE,
# without decoding the transform ID (which the leading dissector, Wireshark,
# cannot do for RFC 9370 — GitLab issue #21072, see 07-DISCOVER-pq-and-late-findings.md).
#
# NOTE: single-line `{ auth = psk; id = x }` blocks with semicolons FAILED to
# parse ("invalid value for: auth") — strongSwan's swanctl.conf parser is not
# semicolon-delimited. Reformatted to one key per line, matching the working
# generator output in scripts/gen_swanctl_conf.py.
connections {
    classical-baseline {
        local_addrs  = 10.10.1.20
        remote_addrs = 10.10.2.20
        local {
            auth = psk
            id = alice-pq-classical-baseline
        }
        remote {
            auth = psk
            id = bob-pq-classical-baseline
        }
        version = 2
        proposals = aes256-sha256-modp2048
        children {
            classical-baseline {
                local_ts = 10.10.1.20/32
                remote_ts = 10.10.2.20/32
                mode = tunnel
                esp_proposals = aes256gcm16
                start_action = none
                dpd_action = clear
            }
        }
    }
    pq-mlkem768 {
        local_addrs  = 10.10.1.20
        remote_addrs = 10.10.2.20
        local {
            auth = psk
            id = alice-pq-pq-mlkem768
        }
        remote {
            auth = psk
            id = bob-pq-pq-mlkem768
        }
        version = 2
        proposals = aes256-sha256-modp2048-ke1_mlkem768
        children {
            pq-mlkem768 {
                local_ts = 10.10.1.20/32
                remote_ts = 10.10.2.20/32
                mode = tunnel
                esp_proposals = aes256gcm16
                start_action = none
                dpd_action = clear
            }
        }
    }
}

secrets {
    ike-1 {
        id-1 = %any
        id-2 = %any
        secret = "0sIhtestlab2026SIH26160presharedkeydonotusehere"
    }
}
