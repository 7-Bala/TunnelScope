# T-083 live demo (weak). Same connection name and addresses in both phases, so the
# change is the same tunnel re-negotiating with a weaker suite (a downgrade), not a new tunnel.
connections {
    live {
        local_addrs  = 10.10.2.240
        remote_addrs = 10.10.1.240
        local {
            auth = psk
            id = b-live
        }
        remote {
            auth = psk
            id = a-live
        }
        version = 2
        proposals = aes128-sha1-modp1024
        children {
            live {
                local_ts = 10.10.2.240/32
                remote_ts = 10.10.1.240/32
                mode = tunnel
                esp_proposals = aes128-sha1
                start_action = none
                life_time = 7200
                rekey_time = 0
            }
        }
    }
}
secrets {
    ike-live {
        id-1 = b-live
        id-2 = a-live
        secret = "0sIhtestlab2026SIH26160presharedkeydonotusehere"
    }
}
