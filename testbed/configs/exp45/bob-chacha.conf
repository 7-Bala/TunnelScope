# EXP-16: gateway-to-gateway tunnel. The real application hosts (apps-a 10.10.1.50,
# apps-b 10.10.2.50) sit BEHIND these gateways, so their traffic is what crosses the tunnel.
connections {
    e45c {
        local_addrs  = 10.10.2.20
        remote_addrs = 10.10.1.20
        local { auth = psk
            id = b-e45c }
        remote { auth = psk
            id = a-e45c }
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        children {
            e45c {
                local_ts = 10.10.2.0/24
                remote_ts = 10.10.1.0/24
                mode = tunnel
                esp_proposals = chacha20poly1305
                start_action = none
                dpd_action = clear
                life_time = 7200
                rekey_time = 0
            }
        }
    }
}
secrets {
    ike-e45c { id-1 = b-e45c
        id-2 = a-e45c
        secret = "0sIhtestlab2026NoSecretpresharedkeydonotusehere" }
