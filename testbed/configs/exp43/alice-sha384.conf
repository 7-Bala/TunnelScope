# EXP-16: gateway-to-gateway tunnel. The real application hosts (apps-a 10.10.1.50,
# apps-b 10.10.2.50) sit BEHIND these gateways, so their traffic is what crosses the tunnel.
connections {
    e43s {
        local_addrs  = 10.10.1.20
        remote_addrs = 10.10.2.20
        local { auth = psk
            id = a-e43s }
        remote { auth = psk
            id = b-e43s }
        version = 2
        proposals = aes256-sha384-modp3072
        children {
            e43s {
                local_ts = 10.10.1.0/24
                remote_ts = 10.10.2.0/24
                mode = tunnel
                esp_proposals = aes256-sha384
                start_action = none
                dpd_action = clear
                life_time = 7200
                rekey_time = 0
            }
        }
    }
}
secrets {
    ike-e43s { id-1 = a-e43s
        id-2 = b-e43s
        secret = "0sIhtestlab2026NoSecretpresharedkeydonotusehere" }
}
